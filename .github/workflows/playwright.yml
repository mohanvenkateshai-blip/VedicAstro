name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    # playwright.config.ts caps the test run itself at 15 min in CI
    # (globalTimeout) so a hang fails fast with a partial report; this
    # ceiling only needs to cover setup + that + upload overhead.
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      CVCE_BASE_URL: http://localhost:8400
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: cvce/requirements.txt

      - name: Install portal dependencies
        working-directory: ./portal
        run: npm ci

      # CI runs the chromium project only (see the test step below), so only
      # that browser is installed.
      - name: Install Playwright browsers
        working-directory: ./portal
        run: npx playwright install --with-deps chromium

      - name: Install CVCE dependencies
        working-directory: ./cvce
        run: |
          pip install -r requirements.txt
          # PyPI's "4.8.7" wheel for PyJHora is not immutable in practice —
          # the currently-published build silently regressed a fix this
          # patcher applies (planet_list.index() on a dict, AttributeError
          # on every /chart call). cvce/Dockerfile already runs this after
          # every fresh pip install for exactly this reason; CI must too.
          python patch_pyjhora.py

      # E2E used to run against production Fly (via CVCE_BASE_URL/
      # CVCE_SERVICE_TOKEN secrets) — that meant CI load competed with real
      # users on a single, non-autoscaled machine. Each timeline test costs
      # a full report_facts recompute (documented 15-20s "on a warm CVCE" —
      # STATUS.md known issue #2); ~15 such tests across 2 parallel workers
      # saturated the machine mid-run, triggering a real Fly health-check
      # failure (confirmed in Fly logs) and a cascade of test timeouts that
      # ate the full 30-minute job budget with nothing passing.
      #
      # An ephemeral local CVCE isolates CI entirely from production: no
      # shared load, no dependency on CVCE_SERVICE_TOKEN, no risk of writing
      # test data into the production timeline DB, and it's faster (no
      # network hop to Fly's LHR region). PyJHora ships its own bundled
      # Swiss Ephemeris data, so no CVCE_SWISS_EPHEMERIS_PATH is needed —
      # verified locally: `ascendant()` for the golden chart resolves to
      # Libra with the env var unset. No CVCE_SERVICE_TOKEN is set below,
      # so the service-auth middleware stays open exactly like local dev
      # (cvce/app/config.py: auth is enabled only when a token is present
      # or SERVICE_AUTH_REQUIRED is set — neither is true here).
      - name: Start CVCE (local, isolated from production)
        working-directory: ./cvce
        run: |
          python -m uvicorn app.server:app --host 0.0.0.0 --port 8400 > cvce.log 2>&1 &
          CVCE_PID=$!
          echo "CVCE_PID=$CVCE_PID" >> $GITHUB_ENV
          echo "Waiting for local CVCE..."
          for i in {1..60}; do
            if curl -sf http://localhost:8400/health > /dev/null 2>&1; then
              echo "CVCE ready"
              exit 0
            fi
            sleep 1
          done
          echo "CVCE failed to start"
          cat cvce.log
          kill $CVCE_PID 2>/dev/null || true
          exit 1

      - name: Start dev server
        working-directory: ./portal
        # CVCE_BASE_URL must be set here, not only on the test-run step
        # below — the running Next.js server process reads process.env at
        # request time from whatever env it booted with.
        env:
          CVCE_BASE_URL: http://localhost:8400
        run: |
          npm run dev > dev.log 2>&1 &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV
          echo "Waiting for dev server..."
          for i in {1..60}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"
          cat dev.log
          kill $DEV_PID 2>/dev/null || true
          exit 1

      # Visual snapshots are baselined on darwin; CI (linux) skips them via
      # --ignore-snapshots until linux baselines are committed.
      - name: Run Playwright tests (chromium)
        working-directory: ./portal
        run: npx playwright test --project=chromium --ignore-snapshots

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            portal/test-results/
            cvce/cvce.log
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: portal/playwright-report/
          retention-days: 7

      - name: Stop servers
        if: always()
        run: |
          if [ -n "$DEV_PID" ]; then
            kill $DEV_PID 2>/dev/null || true
          fi
          if [ -n "$CVCE_PID" ]; then
            kill $CVCE_PID 2>/dev/null || true
          fi
