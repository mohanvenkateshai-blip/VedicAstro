name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CVCE_BASE_URL: ${{ secrets.CVCE_BASE_URL }}
      CVCE_HEALTH_URL: ${{ secrets.CVCE_HEALTH_URL }}
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        working-directory: ./portal
        run: npm ci

      # CI runs the chromium project only (see the test step below), so only
      # that browser is installed.
      - name: Install Playwright browsers
        working-directory: ./portal
        run: npx playwright install --with-deps chromium

      - name: Verify CVCE health
        run: |
          echo "Waiting for CVCE health check at $CVCE_HEALTH_URL..."
          for i in {1..30}; do
            if curl -sf "$CVCE_HEALTH_URL" > /dev/null; then
              echo "CVCE health check passed"
              exit 0
            fi
            echo "Waiting for CVCE... (attempt $i/30)"
            sleep 2
          done
          echo "CVCE health check failed after 60 seconds"
          exit 1

      - name: Start dev server
        working-directory: ./portal
        run: |
          npm run dev > dev.log 2>&1 &
          DEV_PID=$!
          echo "DEV_PID=$DEV_PID" >> $GITHUB_ENV
          echo "Waiting for dev server..."
          for i in {1..60}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Dev server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start"
          cat dev.log
          kill $DEV_PID 2>/dev/null || true
          exit 1

      # Visual snapshots are baselined on darwin; CI (linux) skips them via
      # --ignore-snapshots until linux baselines are committed.
      - name: Run Playwright tests (chromium)
        working-directory: ./portal
        run: npx playwright test --project=chromium --ignore-snapshots
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CVCE_BASE_URL: ${{ secrets.CVCE_BASE_URL }}

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_id }}
          path: |
            portal/test-results/
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: portal/test-results/html-report/
          retention-days: 7

      - name: Stop dev server
        if: always()
        run: |
          if [ -n "$DEV_PID" ]; then
            kill $DEV_PID 2>/dev/null || true
          fi
